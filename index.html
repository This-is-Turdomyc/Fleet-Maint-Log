<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fleet & Boat Maintenance Log</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen">

    <!-- Header / Navigation -->
    <header class="bg-slate-800 border-b border-slate-700 shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-anchor text-cyan-400 text-2xl"></i>
                <h1 class="text-xl font-bold tracking-wide">Fleet & Boat Maintenance Log</h1>
            </div>
            <button onclick="openModal()" class="bg-cyan-600 hover:bg-cyan-500 text-white px-4 py-2 rounded-lg font-medium transition flex items-center space-x-2 shadow-lg shadow-cyan-900/40">
                <i class="fa-solid fa-plus"></i>
                <span>Add Maintenance Record</span>
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-8">
        
        <!-- Metrics / Summary Cards -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-slate-800 border border-slate-700 p-6 rounded-xl shadow-md">
                <p class="text-slate-400 text-sm font-medium">Total Maintenance Logs</p>
                <h3 id="totalLogs" class="text-3xl font-bold mt-2 text-white">0</h3>
            </div>
            <div class="bg-slate-800 border border-slate-700 p-6 rounded-xl shadow-md">
                <p class="text-slate-400 text-sm font-medium">Total Spent</p>
                <h3 id="totalCost" class="text-3xl font-bold mt-2 text-cyan-400">$0.00</h3>
            </div>
            <div class="bg-slate-800 border border-slate-700 p-6 rounded-xl shadow-md">
                <p class="text-slate-400 text-sm font-medium">Pending Tasks</p>
                <h3 id="pendingCount" class="text-3xl font-bold mt-2 text-amber-400">0</h3>
            </div>
        </div>

        <!-- Filter / Search Section -->
        <div class="bg-slate-800 border border-slate-700 p-4 rounded-xl mb-6 flex flex-col md:flex-row justify-between gap-4">
            <input type="text" id="searchInput" onkeyup="renderTable()" placeholder="Search by vessel, system, or description..." class="bg-slate-900 border border-slate-700 px-4 py-2 rounded-lg text-sm focus:outline-none focus:border-cyan-500 w-full md:w-80">
            <select id="statusFilter" onchange="renderTable()" class="bg-slate-900 border border-slate-700 px-4 py-2 rounded-lg text-sm focus:outline-none focus:border-cyan-500 w-full md:w-48">
                <option value="">All Statuses</option>
                <option value="Completed">Completed</option>
                <option value="Pending">Pending</option>
                <option value="In Progress">In Progress</option>
            </select>
        </div>

        <!-- Table Log Section -->
        <div class="bg-slate-800 border border-slate-700 rounded-xl shadow-md overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-700/50 text-slate-400 text-xs uppercase tracking-wider border-b border-slate-700">
                            <th class="p-4">Date</th>
                            <th class="p-4">Vessel / Boat</th>
                            <th class="p-4">System / Component</th>
                            <th class="p-4">Description</th>
                            <th class="p-4">Cost</th>
                            <th class="p-4">Status</th>
                            <th class="p-4 text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="logTableBody" class="divide-y divide-slate-700 text-sm">
                        <!-- Dynamically Injected Rows -->
                    </tbody>
                </table>
            </div>
            <div id="emptyState" class="text-center py-12 hidden">
                <i class="fa-solid fa-ship text-slate-600 text-4xl mb-3"></i>
                <p class="text-slate-400">No maintenance logs found. Click "Add Maintenance Record" to start tracking.</p>
            </div>
        </div>
    </main>

    <!-- Modal Form for Adding/Editing -->
    <div id="recordModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl max-w-lg w-full p-6 shadow-2xl">
            <div class="flex justify-between items-center mb-4">
                <h2 id="modalTitle" class="text-lg font-bold">New Maintenance Record</h2>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <form id="maintenanceForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
                <input type="hidden" id="recordId">
                <div>
                    <label class="block text-xs uppercase text-slate-400 font-semibold mb-1">Vessel / Boat Name</label>
                    <input type="text" id="vesselName" required placeholder="e.g., Sea Wolf, Hull #4" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-cyan-500">
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs uppercase text-slate-400 font-semibold mb-1">System / Category</label>
                        <select id="category" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-cyan-500">
                            <option value="Engine">Engine / Propulsion</option>
                            <option value="Electrical">Electrical System</option>
                            <option value="Hull & Deck">Hull & Deck</option>
                            <option value="Plumbing">Plumbing & Bilge</option>
                            <option value="Safety">Safety Equipment</option>
                            <option value="Rigging">Rigging & Sails</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs uppercase text-slate-400 font-semibold mb-1">Date</label>
                        <input type="date" id="logDate" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-cyan-500">
                    </div>
                </div>
                <div>
                    <label class="block text-xs uppercase text-slate-400 font-semibold mb-1">Maintenance Description</label>
                    <textarea id="description" rows="3" required placeholder="Details about service performed, parts replaced..." class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-cyan-500"></textarea>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs uppercase text-slate-400 font-semibold mb-1">Cost ($)</label>
                        <input type="number" step="0.01" id="cost" required placeholder="0.00" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-cyan-500">
                    </div>
                    <div>
                        <label class="block text-xs uppercase text-slate-400 font-semibold mb-1">Status</label>
                        <select id="status" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-cyan-500">
                            <option value="Completed">Completed</option>
                            <option value="Pending">Pending</option>
                            <option value="In Progress">In Progress</option>
                        </select>
                    </div>
                </div>
                <div class="flex justify-end space-x-3 pt-4 border-t border-slate-700">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-lg text-sm bg-slate-700 hover:bg-slate-600 transition">Cancel</button>
                    <button type="submit" class="px-4 py-2 rounded-lg text-sm bg-cyan-600 hover:bg-cyan-500 font-medium transition shadow-lg shadow-cyan-900/40">Save Record</button>
                </div>
            </form>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        // Initialize local storage dataset if empty
        let logs = JSON.parse(localStorage.getItem('fleet_maintenance_logs')) || [
            { id: 1, vessel: 'Sea Wolf', category: 'Engine', date: '2026-06-12', description: 'Replaced oil filters and impeller.', cost: 350.00, status: 'Completed' },
            { id: 2, vessel: 'Trawler 04', category: 'Electrical', date: '2026-07-01', description: 'Replaced house battery bank AGM 12V.', cost: 1200.50, status: 'Completed' },
            { id: 3, vessel: 'Sea Wolf', category: 'Hull & Deck', date: '2026-08-05', description: 'Scheduled bottom paint and zinc replacement.', cost: 850.00, status: 'Pending' }
        ];

        function saveToLocalStorage() {
            localStorage.setItem('fleet_maintenance_logs', JSON.stringify(logs));
        }

        function openModal(id = null) {
            const modal = document.getElementById('recordModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            
            if (id) {
                document.getElementById('modalTitle').innerText = "Edit Maintenance Record";
                const record = logs.find(l => l.id === id);
                document.getElementById('recordId').value = record.id;
                document.getElementById('vesselName').value = record.vessel;
                document.getElementById('category').value = record.category;
                document.getElementById('logDate').value = record.date;
                document.getElementById('description').value = record.description;
                document.getElementById('cost').value = record.cost;
                document.getElementById('status').value = record.status;
            } else {
                document.getElementById('modalTitle').innerText = "New Maintenance Record";
                document.getElementById('maintenanceForm').reset();
                document.getElementById('recordId').value = '';
                document.getElementById('logDate').valueAsDate = new Date();
            }
        }

        function closeModal() {
            const modal = document.getElementById('recordModal');
            modal.classList.remove('flex');
            modal.classList.add('hidden');
        }

        function handleFormSubmit(event) {
            event.preventDefault();
            const id = document.getElementById('recordId').value;
            const recordObj = {
                id: id ? parseInt(id) : Date.now(),
                vessel: document.getElementById('vesselName').value,
                category: document.getElementById('category').value,
                date: document.getElementById('logDate').value,
                description: document.getElementById('description').value,
                cost: parseFloat(document.getElementById('cost').value),
                status: document.getElementById('status').value
            };

            if (id) {
                const index = logs.findIndex(l => l.id === parseInt(id));
                logs[index] = recordObj;
            } else {
                logs.unshift(recordObj);
            }

            saveToLocalStorage();
            renderTable();
            closeModal();
        }

        function deleteRecord(id) {
            if (confirm('Are you sure you want to delete this log entry?')) {
                logs = logs.filter(l => l.id !== id);
                saveToLocalStorage();
                renderTable();
            }
        }

        function renderTable() {
            const tbody = document.getElementById('logTableBody');
            const searchQuery = document.getElementById('searchInput').value.toLowerCase();
            const statusFilter = document.getElementById('statusFilter').value;
            const emptyState = document.getElementById('emptyState');

            const filteredLogs = logs.filter(log => {
                const matchesSearch = log.vessel.toLowerCase().includes(searchQuery) ||
                                      log.category.toLowerCase().includes(searchQuery) ||
                                      log.description.toLowerCase().includes(searchQuery);
                const matchesStatus = statusFilter === "" || log.status === statusFilter;
                return matchesSearch && matchesStatus;
            });

            // Update Metrics
            document.getElementById('totalLogs').innerText = logs.length;
            const totalCostVal = logs.reduce((acc, curr) => acc + curr.cost, 0);
            document.getElementById('totalCost').innerText = '$' + totalCostVal.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            const pendingVal = logs.filter(l => l.status === 'Pending' || l.status === 'In Progress').length;
            document.getElementById('pendingCount').innerText = pendingVal;

            tbody.innerHTML = '';
            if (filteredLogs.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            } else {
                emptyState.classList.add('hidden');
            }

            filteredLogs.forEach(log => {
                let badgeColor = 'bg-slate-700 text-slate-300';
                if (log.status === 'Completed') badgeColor = 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20';
                if (log.status === 'Pending') badgeColor = 'bg-amber-500/10 text-amber-400 border border-amber-500/20';
                if (log.status === 'In Progress') badgeColor = 'bg-cyan-500/10 text-cyan-400 border border-cyan-500/20';

                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-700/30 transition border-b border-slate-700/50";
                tr.innerHTML = `
                    <td class="p-4 whitespace-nowrap text-slate-300">${log.date}</td>
                    <td class="p-4 whitespace-nowrap font-medium text-white">${log.vessel}</td>
                    <td class="p-4 whitespace-nowrap text-slate-300"><span class="bg-slate-700 px-2.5 py-1 rounded-md text-xs">${log.category}</span></td>
                    <td class="p-4 text-slate-300 max-w-xs truncate">${log.description}</td>
                    <td class="p-4 whitespace-nowrap font-medium text-slate-200">$${log.cost.toFixed(2)}</td>
                    <td class="p-4 whitespace-nowrap"><span class="px-2.5 py-1 rounded-full text-xs font-semibold ${badgeColor}">${log.status}</span></td>
                    <td class="p-4 whitespace-nowrap text-right space-x-2">
                        <button onclick="openModal(${log.id})" class="text-slate-400 hover:text-cyan-400 transition"><i class="fa-solid fa-pen-to-square"></i></button>
                        <button onclick="deleteRecord(${log.id})" class="text-slate-400 hover:text-rose-400 transition"><i class="fa-solid fa-trash"></i></button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Initial render on load
        renderTable();
    </script>
</body>
</html>
