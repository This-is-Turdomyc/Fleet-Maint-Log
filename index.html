<!DOCTYPE html> 
<html lang="en"> 
<head> 
<meta charset="UTF-8"> 
<meta name="viewport" content="width=device-width, initial-scale=1.0"> 
<title>Vessel Maintenance Logbook</title> 
<!-- Chart.js for Dashboard Visualizations --> 
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script> 
<!-- Firebase App & Realtime Database SDKs (v8) --> 
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script> 
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script> 
<style> 
:root {
    --bg-dark: #0f172a; 
    --card-bg: #1e293b; 
    --border-color: #334155; 
    --accent-blue: #38bdf8; 
    --accent-hover: #0284c7; 
    --text-main: #f8fafc; 
    --text-muted: #94a3b8; 
    --success: #22c55e; 
    --warning: #f59e0b; 
    --danger: #ef4444; 
    --info: #a855f7; 
} 
* { 
    box-sizing: border-box; 
    margin: 0; 
    padding: 0; 
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
} 
body { 
    background-color: var(--bg-dark); 
    color: var(--text-main); 
    padding: 20px; 
    line-height: 1.5; 
} 
.container { 
    max-width: 1200px; 
    margin: 0 auto; 
} 
header { 
    display: flex; 
    justify-content: space-between; 
    align-items: center; 
    margin-bottom: 24px; 
    border-bottom: 1px solid var(--border-color); 
    padding-bottom: 16px; 
    flex-wrap: wrap; 
    gap: 12px; 
} 
h1 { 
    font-size: 1.75rem; 
    color: var(--accent-blue); 
    display: flex; 
    align-items: center; 
    gap: 10px; 
} 
.form-card { 
    background: var(--card-bg); 
    border: 1px solid var(--border-color); 
    border-radius: 8px; 
    padding: 20px; 
    margin-bottom: 24px; 
} 
.form-card h2 { 
    font-size: 1.2rem; 
    margin-bottom: 16px; 
    color: var(--accent-blue); 
    display: flex; 
    align-items: center; 
    gap: 8px; 
} 
.form-grid { 
    display: grid; 
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); 
    gap: 16px; 
} 
.form-group { 
    display: flex; 
    flex-direction: column; 
    gap: 6px; 
} 
.form-group.full-width { 
    grid-column: 1 / -1; 
} 
label { 
    font-size: 0.8rem; 
    font-weight: 600; 
    color: var(--text-muted); 
    text-transform: uppercase; 
} 
input, select, textarea { 
    background-color: #0f172a; 
    border: 1px solid var(--border-color); 
    border-radius: 6px; 
    padding: 10px; 
    color: var(--text-main); 
    font-size: 0.95rem; 
    outline: none; 
    transition: border-color 0.2s; 
    width: 100%; 
} 
input:focus, select:focus, textarea:focus { 
    border-color: var(--accent-blue); 
} 
textarea { 
    resize: vertical; 
    min-height: 70px; 
} 
.checkbox-group { 
    display: flex; 
    align-items: center; 
    gap: 10px; 
    background: #0f172a; 
    padding: 12px; 
    border-radius: 6px; 
    border: 1px solid var(--border-color); 
    height: 100%; 
} 
.checkbox-group input[type="checkbox"] { 
    width: 18px; 
    height: 18px; 
    accent-color: var(--accent-blue); 
    cursor: pointer; 
} 
.checkbox-group label { 
    cursor: pointer; 
    text-transform: none; 
    font-size: 0.9rem; 
    color: var(--text-main); 
} 
.parts-builder-container { 
    background: #0f172a; 
    border: 1px solid var(--border-color); 
    border-radius: 6px; 
    padding: 12px; 
    display: flex; 
    flex-direction: column; 
    gap: 10px; 
} 
.part-row { 
    display: grid; 
    grid-template-columns: 2fr 1fr 1fr 1fr auto; 
    gap: 8px; 
    align-items: center; 
} 
@media (max-width: 768px) { 
    .part-row { 
        grid-template-columns: 1fr; 
        background: var(--card-bg); 
        padding: 10px; 
        border-radius: 6px; 
        border: 1px solid var(--border-color); 
    } 
} 
.btn { 
    background-color: var(--accent-blue); 
    color: #0f172a; 
    font-weight: 700; 
    padding: 12px 20px; 
    border: none; 
    border-radius: 6px; 
    cursor: pointer; 
    transition: background-color 0.2s; 
    width: 100%; 
    margin-top: 16px; 
} 
.btn:hover { 
    background-color: var(--accent-hover); 
} 
.btn-secondary { 
    background-color: transparent; 
    border: 1px solid var(--border-color); 
    color: var(--text-main); 
} 
.btn-secondary:hover { 
    background-color: var(--border-color); 
} 
.btn-small { 
    padding: 6px 12px; 
    font-size: 0.8rem; 
    font-weight: 600; 
    border-radius: 4px; 
    cursor: pointer; 
    border: none; 
} 
.filter-bar { 
    display: grid; 
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); 
    gap: 12px; 
    margin-bottom: 20px; 
} 
.logs-container { 
    display: flex; 
    flex-direction: column; 
    gap: 16px; 
    margin-bottom: 24px; 
} 
.log-card { 
    background: var(--card-bg); 
    border: 1px solid var(--border-color); 
    border-left: 5px solid var(--accent-blue); 
    border-radius: 8px; 
    padding: 16px; 
    display: flex; 
    flex-direction: column; 
    gap: 12px; 
} 
.log-card.unseaworthy { border-left-color: var(--danger); } 
.log-card.parts-pending { border-left-color: var(--warning); } 
.log-card.wip-status { border-left-color: var(--info); } 
.log-header { 
    display: flex; 
    justify-content: space-between; 
    align-items: flex-start; 
    border-bottom: 1px solid var(--border-color); 
    padding-bottom: 10px; 
    flex-wrap: wrap; 
    gap: 8px; 
} 
.log-title { 
    font-size: 1.1rem; 
    font-weight: 700; 
    color: var(--accent-blue); 
} 
.log-date { 
    font-size: 0.85rem; 
    color: var(--text-muted); 
} 
.badge { 
    padding: 4px 8px; 
    border-radius: 4px; 
    font-size: 0.75rem; 
    font-weight: 700; 
    text-transform: uppercase; 
    display: inline-block; 
} 
.badge-success { background: rgba(34, 197, 94, 0.2); color: var(--success); } 
.badge-warning { background: rgba(245, 158, 11, 0.2); color: var(--warning); } 
.badge-danger { background: rgba(239, 68, 68, 0.2); color: var(--danger); } 
.badge-info { background: rgba(168, 85, 247, 0.2); color: var(--info); } 
.log-details { 
    display: grid; 
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); 
    gap: 12px; 
    font-size: 0.9rem; 
} 
.log-detail-item span { 
    display: block; 
    font-size: 0.75rem; 
    color: var(--text-muted); 
    text-transform: uppercase; 
} 
.parts-list-table { 
    width: 100%; 
    border-collapse: collapse; 
    margin-top: 6px; 
    font-size: 0.85rem; 
} 
.parts-list-table th, .parts-list-table td { 
    border: 1px solid var(--border-color); 
    padding: 6px 10px; 
    text-align: left; 
} 
.parts-list-table th { 
    background: #0f172a; 
    color: var(--text-muted); 
    font-size: 0.75rem; 
    text-transform: uppercase; 
} 
.log-media img, .log-media video { 
    max-width: 150px; 
    max-height: 150px; 
    border-radius: 6px; 
    border: 1px solid var(--border-color); 
    object-fit: cover; 
} 
.log-actions { 
    display: flex; 
    gap: 10px; 
    justify-content: flex-end; 
    margin-top: 8px; 
    flex-wrap: wrap; 
} 
.log-actions button { 
    padding: 6px 12px; 
    font-size: 0.8rem; 
    border-radius: 4px; 
    cursor: pointer; 
    border: none; 
    font-weight: 600; 
} 
.btn-edit { background: var(--accent-blue); color: #0f172a; } 
.btn-delete { background: var(--danger); color: #fff; } 
.btn-complete-recurring { background: var(--success); color: #0f172a; } 
.header-actions { 
    display: flex; 
    gap: 10px; 
    align-items: center; 
    flex-wrap: wrap; 
} 
.header-actions button { 
    padding: 8px 12px; 
    font-size: 0.85rem; 
    cursor: pointer; 
    border-radius: 6px; 
    background: var(--card-bg); 
    border: 1px solid var(--border-color); 
    color: var(--text-main); 
} 
.header-actions button:hover { 
    background: var(--border-color); 
} 
.dashboard-grid { 
    display: grid; 
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); 
    gap: 16px; 
    margin-top: 40px; 
    border-top: 1px solid var(--border-color); 
    padding-top: 24px; 
} 
.stat-card { 
    background: var(--card-bg); 
    border: 1px solid var(--border-color); 
    border-radius: 8px; 
    padding: 16px; 
    display: flex; 
    flex-direction: column; 
    justify-content: space-between; 
} 
.stat-card h3 { 
    font-size: 0.85rem; 
    text-transform: uppercase; 
    color: var(--text-muted); 
    letter-spacing: 0.05em; 
} 
.stat-card .value { 
    font-size: 2.0rem; 
    font-weight: 700; 
    margin-top: 8px; 
} 
.chart-container { 
    position: relative; 
    height: 180px; 
    width: 100%; 
    margin-top: 10px; 
} 
</style> 
</head> 
<body> 
<div class="container"> 
    <header> 
        <h1>⚓ Vessel Maintenance Logbook</h1> 
        <div class="header-actions"> 
            <button id="notif-btn" onclick="requestNotificationPermission()" style="background: rgba(56, 189, 248, 0.15); border-color: var(--accent-blue); color: var(--accent-blue); font-weight: 600;">🔔 Enable Notifications</button> 
            <button onclick="exportJSON()">📥 Export Data</button> 
            <button onclick="document.getElementById('import-file').click()">📤 Import Data</button> 
            <input type="file" id="import-file" style="display: none;" accept=".json" onchange="importJSON(event)"> 
        </div> 
    </header> 

    <!-- Form Section --> 
    <div class="form-card"> 
        <h2 id="form-title">📝 New Log Entry</h2> 
        <form id="log-form" onsubmit="handleFormSubmit(event)"> 
            <input type="hidden" id="log-id"> 
            <div class="form-grid"> 
                <div class="form-group"> 
                    <label for="vessel-name">Vessel Name</label> 
                    <input type="text" id="vessel-name" required list="vessel-list" placeholder="e.g. Launch 1, Yacht Alpha"> 
                    <datalist id="vessel-list"></datalist> 
                </div> 
                <div class="form-group"> 
                    <label for="equipment">Equipment / Component</label> 
                    <input type="text" id="equipment" required list="equipment-list" placeholder="e.g. Port Main Engine, Gen 1..."> 
                    <datalist id="equipment-list"></datalist> 
                </div> 
                <div class="form-group"> 
                    <label for="category">Marine System / Category</label> 
                    <select id="category" required> 
                        <option value="Propulsion / Main Engines">Propulsion / Main Engines</option> 
                        <option value="Generators / Electrical">Generators / Electrical</option> 
                        <option value="Hydraulics / Steering">Hydraulics / Steering</option> 
                        <option value="Bilge / Fire / Piping">Bilge / Fire / Piping</option> 
                        <option value="HVAC / Refrigeration">HVAC / Refrigeration</option> 
                        <option value="Navigation / Electronics">Navigation / Electronics</option> 
                        <option value="Deck Machinery / Rigging">Deck Machinery / Rigging</option> 
                        <option value="Hull / Structural">Hull / Structural</option> 
                        <option value="Safety Equipment">Safety Equipment</option> 
                        <option value="General Routine Service">General Routine Service</option> 
                    </select> 
                </div> 
                <div class="form-group"> 
                    <label for="log-date">Log Date</label> 
                    <input type="date" id="log-date" required onchange="calculateNextServiceDate()"> 
                </div> 
                <div class="form-group"> 
                    <label for="vessel-status">Vessel Operational Status</label> 
                    <select id="vessel-status" required onchange="handleVesselStatusChange()"> 
                        <option value="Operational (Ready for Sea)">Operational (Ready for Sea)</option> 
                        <option value="Operational - Minor Defect (Parts Pending)">Operational - Minor Defect (Parts Pending)</option> 
                        <option value="Work in Progress (WIP)">Work in Progress (WIP)</option> 
                        <option value="Out of Service (Unseaworthy)">Out of Service (Unseaworthy)</option> 
                    </select> 
                </div> 
                <div class="form-group"> 
                    <label for="tech-name">Technician Name</label> 
                    <input type="text" id="tech-name" required list="tech-list" placeholder="e.g. J. Smith"> 
                    <datalist id="tech-list"></datalist> 
                </div> 
                <div class="form-group"> 
                    <label for="engine-hours">Engine / Generator Hours</label> 
                    <input type="text" id="engine-hours" list="hours-list" placeholder="e.g. 1420 hrs or N/A"> 
                    <datalist id="hours-list"></datalist> 
                </div> 
                <div class="form-group"> 
                    <div id="rts-container" class="checkbox-group" style="margin-top: 20px;"> 
                        <input type="checkbox" id="signoff" checked onchange="handleSignoffChange()"> 
                        <label for="signoff"><strong id="signoff-label-text">Approved for Service / Sea</strong></label> 
                    </div> 
                </div> 
                <div class="form-group full-width"> 
                    <label for="defect">Defect / Issue Observed</label> 
                    <textarea id="defect" list="defect-list" placeholder="Describe squeak, leak, fault code, or observed issue (if applicable)..."></textarea> 
                    <datalist id="defect-list"></datalist> 
                </div> 
                <div class="form-group full-width"> 
                    <label for="work-done">Work Accomplished / Maintenance Action Taken</label> 
                    <textarea id="work-done" required list="workdone-list" placeholder="Describe inspection findings, repairs, fluid changes, adjustments, or testing performed..."></textarea> 
                    <datalist id="workdone-list"></datalist> 
                </div> 

                <!-- Multiple Parts Builder Section --> 
                <div class="form-group full-width"> 
                    <label>Parts Installed / Needed (Optional)</label> 
                    <div class="parts-builder-container" id="parts-builder-container"> 
                        <div style="display: grid; grid-template-columns: 2fr 1fr 1fr 1fr auto; gap: 8px; font-size: 0.75rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase;"> 
                            <span>Part Name / Desc</span> 
                            <span>P/N or SKU (or N/A)</span> 
                            <span>Qty / Unit (e.g. 500ml, 1L)</span> 
                            <span>Unit Cost ($ or N/A)</span> 
                            <span></span> 
                        </div> 
                        <div id="parts-rows-wrapper" style="display: flex; flex-direction: column; gap: 8px;"></div> 
                        <button type="button" class="btn-small btn-secondary" onclick="addPartRow()" style="align-self: flex-start; margin-top: 4px;">➕ Add Part / Item</button> 
                    </div> 
                </div> 

                <div class="form-group"> 
                    <label for="labor-hours">Labor Hours</label> 
                    <input type="number" step="0.5" id="labor-hours" placeholder="e.g. 2.5"> 
                </div> 
                <div class="form-group"> 
                    <label for="media-files">Attach Photos or Videos (Multiple allowed)</label> 
                    <input type="file" id="media-files" accept="image/*,video/*" multiple onchange="handleFileSelect(event)"> 
                    <input type="hidden" id="media-list-json"> 
                </div> 
                <div class="form-group full-width" id="media-preview-container" style="display: none;">
                    <label>Attached Media Previews</label>
                    <div id="media-thumbnails-grid" style="display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px;"></div>
                </div> 
                <div class="form-group full-width"> 
                    <div class="checkbox-group"> 
                        <input type="checkbox" id="next-service-toggle" onchange="toggleNextServiceFields()"> 
                        <label for="next-service-toggle"><strong>Schedule Recurring Maintenance / Next Service Task</strong></label> 
                    </div> 
                </div> 
                <div class="form-group" id="next-service-freq-group" style="display: none;"> 
                    <label for="next-service-freq">Recurring Frequency</label> 
                    <select id="next-service-freq" onchange="calculateNextServiceDate()"> 
                        <option value="weekly">Weekly</option> 
                        <option value="monthly">Monthly</option> 
                        <option value="yearly">Yearly</option> 
                        <option value="custom">Custom Date</option> 
                    </select> 
                </div> 
                <div class="form-group" id="next-service-date-group" style="display: none;"> 
                    <label for="next-service-date">Next Service Due Date</label> 
                    <input type="date" id="next-service-date"> 
                </div> 
                <div class="form-group" id="next-service-hours-group" style="display: none;"> 
                    <label for="next-service-hours">Next Service Due Hours</label> 
                    <input type="text" id="next-service-hours" placeholder="e.g. 1500 hrs"> 
                </div> 
            </div> 
            <button type="submit" class="btn" id="submit-btn">SAVE LOG ENTRY</button> 
            <button type="button" class="btn btn-secondary" id="cancel-btn" style="display: none; margin-top: 8px;" onclick="resetForm()">CANCEL EDIT</button> 
        </form> 
    </div> 

    <!-- Global Datalists for Autocomplete across previous entries --> 
    <datalist id="equipment-list"></datalist> 
    <datalist id="tech-list"></datalist> 
    <datalist id="hours-list"></datalist> 
    <datalist id="partname-list"></datalist> 
    <datalist id="partno-list"></datalist> 
    <datalist id="partqty-list"></datalist> 
    <datalist id="partcost-list"></datalist> 

    <!-- Filter & Sort Bar --> 
    <div class="filter-bar"> 
        <select id="filter-vessel" onchange="renderLogs()"> 
            <option value="ALL">All Vessels</option> 
        </select> 
        <select id="filter-category" onchange="renderLogs()"> 
            <option value="ALL">All Categories</option> 
            <option value="Propulsion / Main Engines">Propulsion / Main Engines</option> 
            <option value="Generators / Electrical">Generators / Electrical</option> 
            <option value="Hydraulics / Steering">Hydraulics / Steering</option> 
            <option value="Bilge / Fire / Piping">Bilge / Fire / Piping</option> 
            <option value="HVAC / Refrigeration">HVAC / Refrigeration</option> 
            <option value="Navigation / Electronics">Navigation / Electronics</option> 
            <option value="Deck Machinery / Rigging">Deck Machinery / Rigging</option> 
            <option value="Hull / Structural">Hull / Structural</option> 
            <option value="Safety Equipment">Safety Equipment</option> 
            <option value="General Routine Service">General Routine Service</option> 
        </select> 
        <select id="filter-status" onchange="renderLogs()"> 
            <option value="ALL">All Work Statuses</option> 
            <option value="COMPLETED">Completed Work Only</option> 
            <option value="WIP">Work in Progress (Pending / OOS / WIP)</option> 
        </select> 
        <select id="filter-recurring" onchange="renderLogs()"> 
            <option value="ALL">All Maintenance Tasks</option> 
            <option value="RECURRING">Recurring Maintenance Only</option> 
            <option value="NON-RECURRING">Standard Maintenance Only</option> 
        </select> 
        <select id="sort-order" onchange="renderLogs()"> 
            <option value="NEWEST">Sort: Newest First</option> 
            <option value="OLDEST">Sort: Oldest First</option> 
            <option value="COST_HIGH">Sort: Highest Cost</option> 
            <option value="VESSEL">Sort: Vessel Name</option> 
        </select> 
        <input type="text" id="search-input" placeholder="🔍 Search text..." oninput="renderLogs()"> 
    </div> 

    <!-- Log List --> 
    <div class="logs-container" id="logs-container"></div> 

    <!-- Bottom KPI Dashboard & Charts --> 
    <div class="dashboard-grid"> 
        <div class="stat-card"> 
            <h3>Total Log Entries</h3> 
            <div class="value" id="kpi-total-logs">0</div> 
        </div> 
        <div class="stat-card"> 
            <h3>Unseaworthy / OOS Vessels</h3> 
            <div class="value" id="kpi-oos-vessels" style="color: var(--danger);">0</div> 
        </div> 
        <div class="stat-card"> 
            <h3>Parts Pending</h3> 
            <div class="value" id="kpi-parts-pending" style="color: var(--warning);">0</div> 
        </div> 
        <div class="stat-card"> 
            <h3>Total Maintenance Spend</h3> 
            <div class="value" id="kpi-total-spend" style="color: var(--success);">$0.00</div> 
        </div> 
        <div class="stat-card full-width" style="grid-column: 1 / -1;"> 
            <h3>Maintenance Categories Breakdown</h3> 
            <div class="chart-container"> 
                <canvas id="categoryChart"></canvas> 
            </div> 
        </div> 
    </div> 
</div> 

<script> 
const firebaseConfig = { databaseURL: "https://rhkyc-fleet-default-rtdb.asia-southeast1.firebasedatabase.app" }; 
if (!firebase.apps.length) { 
    firebase.initializeApp(firebaseConfig); 
} 
const dbRef = firebase.database().ref('logs'); 
let logs = []; 
let myChart = null; 
let currentMediaList = []; 

document.addEventListener('DOMContentLoaded', () => { 
    document.getElementById('log-date').valueAsDate = new Date(); 
    initChart(); 
    initRealtimeSync(); 
    checkNotificationButtonState(); 
}); 

function handleVesselStatusChange() { 
    const statusSelect = document.getElementById('vessel-status'); 
    const signoffCheckbox = document.getElementById('signoff'); 
    const val = statusSelect.value; 

    if (val === 'Operational (Ready for Sea)' || val === 'Operational - Minor Defect (Parts Pending)') { 
        signoffCheckbox.checked = true; 
    } else { 
        signoffCheckbox.checked = false; 
    } 
    updateSignoffUI(); 
} 

function handleSignoffChange() { 
    const statusSelect = document.getElementById('vessel-status'); 
    const signoffCheckbox = document.getElementById('signoff'); 

    if (!signoffCheckbox.checked) { 
        if (statusSelect.value === 'Operational (Ready for Sea)' || statusSelect.value === 'Operational - Minor Defect (Parts Pending)') { 
            statusSelect.value = 'Out of Service (Unseaworthy)'; 
        } 
    } else { 
        if (statusSelect.value === 'Out of Service (Unseaworthy)' || statusSelect.value === 'Work in Progress (WIP)') { 
            statusSelect.value = 'Operational (Ready for Sea)'; 
        } 
    } 
    updateSignoffUI(); 
} 

function updateSignoffUI() { 
    const signoffCheckbox = document.getElementById('signoff'); 
    const labelText = document.getElementById('signoff-label-text'); 
    const container = document.getElementById('rts-container'); 

    if (signoffCheckbox.checked) { 
        labelText.innerText = "Approved for Service / Sea"; 
        container.style.borderColor = "var(--success)"; 
        container.style.background = "rgba(34, 197, 94, 0.05)"; 
    } else { 
        labelText.innerText = "Not Approved / Restricted"; 
        container.style.borderColor = "var(--danger)"; 
        container.style.background = "rgba(239, 68, 68, 0.05)"; 
    } 
} 

function addPartRow(name = '', partNo = '', qty = '', cost = '') { 
    const wrapper = document.getElementById('parts-rows-wrapper'); 
    const rowId = 'part-row-' + Date.now() + '-' + Math.random().toString(36).substr(2, 4); 
    const rowDiv = document.createElement('div'); 
    rowDiv.className = 'part-row'; 
    rowDiv.id = rowId; 
    rowDiv.innerHTML = ` 
        <input type="text" class="part-name" placeholder="Part Name / Description" value="${name}" list="partname-list" required> 
        <input type="text" class="part-number" placeholder="P/N or SKU (or N/A)" value="${partNo}" list="partno-list"> 
        <input type="text" class="part-qty" placeholder="e.g. 500ml, 1L, 2" value="${qty}" list="partqty-list" title="Quantity / Unit" required> 
        <input type="text" class="part-cost" placeholder="Unit Cost ($ or N/A)" value="${cost}" list="partcost-list" title="Unit Cost ($)" required> 
        <button type="button" class="btn-small" style="background: var(--danger); color: white;" onclick="document.getElementById('${rowId}').remove()">✕</button> 
    `; 
    wrapper.appendChild(rowDiv); 
    updateGlobalDatalists(); 
} 

function handleFileSelect(event) { 
    const files = event.target.files; 
    if (!files || files.length === 0) return; 

    Array.from(files).forEach(file => { 
        const reader = new FileReader(); 
        reader.onload = function(e) { 
            currentMediaList.push({ 
                base64: e.target.result, 
                type: file.type, 
                name: file.name 
            }); 
            updateMediaPreviews(); 
        }; 
        reader.readAsDataURL(file); 
    }); 
    event.target.value = ''; 
} 

function removeMediaItem(index) { 
    currentMediaList.splice(index, 1); 
    updateMediaPreviews(); 
} 

function updateMediaPreviews() { 
    const container = document.getElementById('media-preview-container'); 
    const grid = document.getElementById('media-thumbnails-grid'); 
    const hiddenInput = document.getElementById('media-list-json'); 

    if (currentMediaList.length === 0) { 
        container.style.display = 'none'; 
        grid.innerHTML = ''; 
        hiddenInput.value = ''; 
        return; 
    } 

    container.style.display = 'flex'; 
    hiddenInput.value = JSON.stringify(currentMediaList); 

    grid.innerHTML = currentMediaList.map((media, index) => { 
        const isVid = media.type && media.type.startsWith('video'); 
        const previewElement = isVid 
            ? `<video src="${media.base64}" style="width: 80px; height: 80px; object-fit: cover; border-radius: 4px;"></video>` 
            : `<img src="${media.base64}" style="width: 80px; height: 80px; object-fit: cover; border-radius: 4px;" alt="preview">`; 

        return ` 
            <div style="position: relative; display: inline-block; border: 1px solid var(--border-color); border-radius: 6px; padding: 4px; background: #0f172a;"> 
                ${previewElement} 
                <button type="button" onclick="removeMediaItem(${index})" style="position: absolute; top: -6px; right: -6px; background: var(--danger); color: white; border: none; border-radius: 50%; width: 20px; height: 20px; font-size: 11px; cursor: pointer; display: flex; align-items: center; justify-content: center;">✕</button> 
            </div> 
        `; 
    }).join(''); 
} 

function checkNotificationButtonState() { 
    const btn = document.getElementById('notif-btn'); 
    if (!("Notification" in window)) { 
        btn.innerText = "🚫 Notifications Unsupported"; 
        btn.disabled = true; 
        return; 
    } 
    if (Notification.permission === "granted") { 
        btn.innerText = "🔔 Notifications Enabled"; 
        btn.style.borderColor = "var(--success)"; 
        btn.style.color = "var(--success)"; 
        btn.style.background = "rgba(34, 197, 94, 0.15)"; 
    } else if (Notification.permission === "denied") { 
        btn.innerText = "🔕 Notifications Blocked"; 
        btn.style.borderColor = "var(--danger)"; 
        btn.style.color = "var(--danger)"; 
        btn.style.background = "rgba(239, 68, 68, 0.15)"; 
    } 
} 

function requestNotificationPermission() { 
    if (!("Notification" in window)) { 
        alert("This browser does not support desktop notifications."); 
        return; 
    } 
    Notification.requestPermission().then((permission) => { 
        checkNotificationButtonState(); 
        if (permission === "granted") { 
            new Notification("Vessel Logbook", { body: "Browser notifications are now successfully enabled!" }); 
            triggerStartupNotifications(); 
        } else { 
            alert("Notification permission was denied. Please check your browser site settings to allow notifications."); 
        } 
    }); 
} 

function triggerStartupNotifications() { 
    if (!logs || logs.length === 0) return; 
    const today = new Date(); 
    today.setHours(0, 0, 0, 0); 
    let wipCount = 0; 
    let oosCount = 0; 
    let partsPendingCount = 0; 
    let explicitWipCount = 0; 
    let overdueCount = 0; 
    let dueTodayCount = 0; 
    let upcomingCount = 0; 
    const threeDaysFromNow = new Date(today.getTime()); 
    threeDaysFromNow.setDate(threeDaysFromNow.getDate() + 3); 

    logs.forEach(l => { 
        const isWIPStatus = l.vesselStatus === 'Work in Progress (WIP)'; 
        const isOOS = l.vesselStatus === 'Out of Service (Unseaworthy)'; 
        const isPartsPending = l.vesselStatus && l.vesselStatus.includes('Parts Pending'); 
        const isWIP = l.isCompleted === false || isWIPStatus; 

        if (isOOS) { oosCount++; wipCount++; } 
        else if (isPartsPending) { partsPendingCount++; wipCount++; } 
        else if (isWIPStatus) { explicitWipCount++; wipCount++; } 
        else if (isWIP) { wipCount++; } 

        if (l.hasNextService && l.nextServiceDate) { 
            const dueDate = new Date(l.nextServiceDate); 
            dueDate.setHours(0, 0, 0, 0); 
            if (dueDate.getTime() < today.getTime()) { overdueCount++; } 
            else if (dueDate.getTime() === today.getTime()) { dueTodayCount++; } 
            else if (dueDate.getTime() <= threeDaysFromNow.getTime()) { upcomingCount++; } 
        } 
    }); 

    const totalRecurringAlerts = overdueCount + dueTodayCount + upcomingCount; 
    if (wipCount > 0 || totalRecurringAlerts > 0) { 
        let alertMsg = `⚠️ Fleet Notice: ${wipCount} WIP / OOS Issues (${oosCount} Out of Service, ${partsPendingCount} Parts Pending, ${explicitWipCount} WIP) | 🔁 Recurring: ${overdueCount} Overdue, ${dueTodayCount} Due Today, ${upcomingCount} Upcoming.`; 
        showAppBanner(alertMsg); 
        if ("Notification" in window && Notification.permission === "granted") { 
            try { 
                new Notification("Vessel Fleet Alert", { body: alertMsg, icon: "⚓" }); 
            } catch (e) { 
                console.log("Desktop notification suppressed by browser policy."); 
            } 
        } 
    } 
} 

function showAppBanner(message) { 
    let banner = document.getElementById('fleet-alert-banner'); 
    if (!banner) { 
        banner = document.createElement('div'); 
        banner.id = 'fleet-alert-banner'; 
        banner.style.cssText = "background: rgba(239, 68, 68, 0.2); border: 1px solid var(--danger); color: var(--text-main); padding: 14px 18px; border-radius: 8px; margin-bottom: 20px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);"; 
        document.querySelector('header').after(banner); 
    } 
    banner.innerHTML = `<span>${message}</span> <button onclick="this.parentElement.remove()" style="background:transparent; border:none; color:var(--text-main); cursor:pointer; font-size:1.1rem; padding: 0 8px;">✕</button>`; 
}

    dbRef.on('value', (snapshot) => { 
        const data = snapshot.val(); 
        logs = data ? Object.values(data) : []; 
        renderLogs();

function toggleNextServiceFields() { 
    const isChecked = document.getElementById('next-service-toggle').checked; 
    document.getElementById('next-service-freq-group').style.display = isChecked ? 'flex' : 'none'; 
    document.getElementById('next-service-hours-group').style.display = isChecked ? 'flex' : 'none'; 
    if (isChecked) { 
        document.getElementById('next-service-freq').value = 'weekly'; 
        calculateNextServiceDate(); 
    } else { 
        document.getElementById('next-service-date-group').style.display = 'none'; 
    } 
} 

function calculateNextServiceDate() { 
    const freq = document.getElementById('next-service-freq').value; 
    const dateGroup = document.getElementById('next-service-date-group'); 
    const logDateVal = document.getElementById('log-date').value; 
    if (freq === 'custom') { 
        dateGroup.style.display = 'flex'; 
        return; 
    } else { 
        dateGroup.style.display = 'none'; 
    } 
    if (!logDateVal) return; 
    let baseDate = new Date(logDateVal); 
    if (freq === 'weekly') { 
        baseDate.setDate(baseDate.getDate() + 7); 
    } else if (freq === 'monthly') { 
        baseDate.setMonth(baseDate.getMonth() + 1); 
    } else if (freq === 'yearly') { 
        baseDate.setFullYear(baseDate.getFullYear() + 1); 
    } 
    document.getElementById('next-service-date').value = baseDate.toISOString().split('T')[0]; 
} 

function updateGlobalDatalists() { 
    const vessels = [...new Set(logs.map(l => l.vesselName))].filter(Boolean); 
    const equipments = [...new Set(logs.map(l => l.equipment))].filter(Boolean); 
    const techs = [...new Set(logs.map(l => l.techName))].filter(Boolean); 
    const hours = [...new Set(logs.map(l => l.engineHours))].filter(Boolean); 
    const defects = [...new Set(logs.map(l => l.defect))].filter(Boolean); 
    const workDones = [...new Set(logs.map(l => l.workDone))].filter(Boolean); 

    let partNames = new Set(); 
    let partNos = new Set(); 
    let partQtys = new Set(); 
    let partCosts = new Set(); 

    logs.forEach(l => { 
        if (l.parts && Array.isArray(l.parts)) { 
            l.parts.forEach(p => { 
                if (p.name) partNames.add(p.name); 
                if (p.partNo) partNos.add(p.partNo); 
                if (p.qty) partQtys.add(p.qty); 
                if (p.cost) partCosts.add(p.cost); 
            }); 
        } 
    }); 

    populateDatalist('vessel-list', vessels); 
    populateDatalist('equipment-list', equipments); 
    populateDatalist('tech-list', techs); 
    populateDatalist('hours-list', hours); 
    populateDatalist('defect-list', defects); 
    populateDatalist('workdone-list', workDones); 
    populateDatalist('partname-list', [...partNames]); 
    populateDatalist('partno-list', [...partNos]); 
    populateDatalist('partqty-list', [...partQtys]); 
    populateDatalist('partcost-list', [...partCosts]); 

    const vesselFilterSelect = document.getElementById('filter-vessel'); 
    const currentFilterVal = vesselFilterSelect.value; 
    vesselFilterSelect.innerHTML = '<option value="ALL">All Vessels</option>' + vessels.map(v => `<option value="${v}">${v}</option>`).join(''); 
    vesselFilterSelect.value = currentFilterVal; 
} 

function populateDatalist(id, array) { 
    const dl = document.getElementById(id); 
    if (dl) { 
        dl.innerHTML = array.map(item => `<option value="${item}">`).join(''); 
    } 
} 

function handleFormSubmit(event) { 
    event.preventDefault(); 
    const idField = document.getElementById('log-id').value; 
    const logId = idField ? idField : 'log_' + Date.now(); 

    const vesselName = document.getElementById('vessel-name').value.trim(); 
    const equipment = document.getElementById('equipment').value.trim(); 
    const category = document.getElementById('category').value; 
    const logDate = document.getElementById('log-date').value; 
    const vesselStatus = document.getElementById('vessel-status').value; 
    const techName = document.getElementById('tech-name').value.trim(); 
    const engineHours = document.getElementById('engine-hours').value.trim(); 
    const signoff = document.getElementById('signoff').checked; 
    const defect = document.getElementById('defect').value.trim(); 
    const workDone = document.getElementById('work-done').value.trim(); 
    const laborHours = document.getElementById('labor-hours').value ? parseFloat(document.getElementById('labor-hours').value) : 0; 

    let parts = []; 
    const rowDivs = document.querySelectorAll('#parts-rows-wrapper .part-row'); 
    rowDivs.forEach(row => { 
        const name = row.querySelector('.part-name').value.trim(); 
        const partNo = row.querySelector('.part-number').value.trim(); 
        const qty = row.querySelector('.part-qty').value.trim(); 
        const cost = row.querySelector('.part-cost').value.trim(); 
        if (name) { 
            parts.push({ name, partNo, qty, cost }); 
        } 
    }); 

    const hasNextService = document.getElementById('next-service-toggle').checked; 
    let nextServiceFreq = ''; 
    let nextServiceDate = ''; 
    let nextServiceHours = ''; 
    if (hasNextService) { 
        nextServiceFreq = document.getElementById('next-service-freq').value; 
        nextServiceDate = document.getElementById('next-service-date').value; 
        nextServiceHours = document.getElementById('next-service-hours').value.trim(); 
    } 

    const mediaList = [...currentMediaList]; 
    const existingLog = logs.find(l => l.id === logId); 
    let isCompleted = existingLog ? existingLog.isCompleted : true; 

    const newLog = { 
        id: logId, 
        vesselName, 
        equipment, 
        category, 
        logDate, 
        vesselStatus, 
        techName, 
        engineHours, 
        signoff, 
        defect, 
        workDone, 
        laborHours, 
        parts, 
        hasNextService, 
        nextServiceFreq, 
        nextServiceDate, 
        nextServiceHours, 
        mediaList, 
        isCompleted, 
        timestamp: existingLog ? existingLog.timestamp : Date.now() 
    }; 

    dbRef.child(logId).set(newLog).then(() => { 
        resetForm(); 
    }).catch((error) => { 
        alert("Failed to save log entry: " + error.message); 
    }); 
} 

function resetForm() { 
    document.getElementById('log-form').reset(); 
    document.getElementById('log-id').value = ''; 
    document.getElementById('log-date').valueAsDate = new Date(); 
    document.getElementById('parts-rows-wrapper').innerHTML = ''; 
    currentMediaList = []; 
    updateMediaPreviews(); 
    document.getElementById('submit-btn').innerText = "SAVE LOG ENTRY"; 
    document.getElementById('cancel-btn').style.display = 'none'; 
    document.getElementById('form-title').innerText = "📝 New Log Entry"; 
    document.getElementById('next-service-toggle').checked = false; 
    toggleNextServiceFields(); 
    document.getElementById('signoff').checked = true; 
    handleVesselStatusChange(); 
} 

function editLog(id) { 
    const log = logs.find(l => l.id === id); 
    if (!log) return; 

    document.getElementById('log-id').value = log.id; 
    document.getElementById('vessel-name').value = log.vesselName || ''; 
    document.getElementById('equipment').value = log.equipment || ''; 
    document.getElementById('category').value = log.category || 'Propulsion / Main Engines'; 
    document.getElementById('log-date').value = log.logDate || ''; 
    document.getElementById('vessel-status').value = log.vesselStatus || 'Operational (Ready for Sea)'; 
    document.getElementById('tech-name').value = log.techName || ''; 
    document.getElementById('engine-hours').value = log.engineHours || ''; 
    document.getElementById('signoff').checked = log.signoff !== false; 
    document.getElementById('defect').value = log.defect || ''; 
    document.getElementById('work-done').value = log.workDone || ''; 
    document.getElementById('labor-hours').value = log.laborHours || ''; 

    document.getElementById('parts-rows-wrapper').innerHTML = ''; 
    if (log.parts && Array.isArray(log.parts)) { 
        log.parts.forEach(p => addPartRow(p.name, p.partNo, p.qty, p.cost)); 
    } 

    currentMediaList = log.mediaList ? [...log.mediaList] : []; 
    if (currentMediaList.length === 0 && log.mediaBase64) { 
        currentMediaList.push({ base64: log.mediaBase64, type: log.mediaType || 'image/png', name: 'attachment' }); 
    } 
    updateMediaPreviews(); 

    const nextToggle = document.getElementById('next-service-toggle'); 
    nextToggle.checked = !!log.hasNextService; 
    toggleNextServiceFields(); 
    if (log.hasNextService) { 
        document.getElementById('next-service-freq').value = log.nextServiceFreq || 'weekly'; 
        calculateNextServiceDate(); 
        if (log.nextServiceDate) document.getElementById('next-service-date').value = log.nextServiceDate; 
        document.getElementById('next-service-hours').value = log.nextServiceHours || ''; 
    } 

    document.getElementById('submit-btn').innerText = "UPDATE LOG ENTRY"; 
    document.getElementById('cancel-btn').style.display = 'block'; 
    document.getElementById('form-title').innerText = "✏️ Edit Log Entry"; 

    updateSignoffUI(); 
    window.scrollTo({ top: 0, behavior: 'smooth' }); 
} 

function deleteLog(id) { 
    if (confirm("Are you sure you want to delete this maintenance log entry?")) { 
        dbRef.child(id).remove().catch(err => alert("Error deleting: " + err.message)); 
    } 
} 

function completeRecurringTask(id) { 
    const log = logs.find(l => l.id === id); 
    if (!log) return; 
    const newId = 'log_' + Date.now(); 
    const newLog = { 
        ...log, 
        id: newId, 
        logDate: new Date().toISOString().split('T')[0], 
        isCompleted: true, 
        timestamp: Date.now() 
    }; 
    dbRef.child(newId).set(newLog).then(() => { 
        alert("Recurring maintenance task marked completed and logged for today!"); 
    }).catch(err => alert("Error recording recurring completion: " + err.message)); 
} 

function renderLogs() { 
    const container = document.getElementById('logs-container'); 
    const filterVessel = document.getElementById('filter-vessel').value; 
    const filterCategory = document.getElementById('filter-category').value; 
    const filterStatus = document.getElementById('filter-status').value; 
    const filterRecurring = document.getElementById('filter-recurring').value; 
    const sortOrder = document.getElementById('sort-order').value; 
    const searchText = document.getElementById('search-input').value.toLowerCase(); 

    updateGlobalDatalists(); 

    let filtered = logs.filter(l => { 
        if (filterVessel !== 'ALL' && l.vesselName !== filterVessel) return false; 
        if (filterCategory !== 'ALL' && l.category !== filterCategory) return false; 

        const isWIPStatus = l.vesselStatus === 'Work in Progress (WIP)'; 
        const isOOS = l.vesselStatus === 'Out of Service (Unseaworthy)'; 
        const isPartsPending = l.vesselStatus && l.vesselStatus.includes('Parts Pending'); 
        const isWIP = l.isCompleted === false || isWIPStatus || isOOS || isPartsPending; 

        if (filterStatus === 'COMPLETED' && isWIP) return false; 
        if (filterStatus === 'WIP' && !isWIP) return false; 

        if (filterRecurring === 'RECURRING' && !l.hasNextService) return false; 
        if (filterRecurring === 'NON-RECURRING' && l.hasNextService) return false; 

        if (searchText) { 
            const combined = `${l.vesselName} ${l.equipment} ${l.category} ${l.techName} ${l.defect} ${l.workDone}`.toLowerCase(); 
            if (!combined.includes(searchText)) return false; 
        } 
        return true; 
    }); 

    filtered.sort((a, b) => { 
        if (sortOrder === 'NEWEST') return (b.timestamp || 0) - (a.timestamp || 0); 
        if (sortOrder === 'OLDEST') return (a.timestamp || 0) - (b.timestamp || 0); 
        if (sortOrder === 'VESSEL') return (a.vesselName || '').localeCompare(b.vesselName || ''); 
        if (sortOrder === 'COST_HIGH') { 
            const costA = calculateLogTotalCost(a); 
            const costB = calculateLogTotalCost(b); 
            return costB - costA; 
        } 
        return 0; 
    }); 

    if (filtered.length === 0) { 
        container.innerHTML = `<div style="text-align: center; color: var(--text-muted); padding: 40px; background: var(--card-bg); border-radius: 8px; border: 1px solid var(--border-color);">No maintenance log entries found matching current filters.</div>`; 
    } else { 
        container.innerHTML = filtered.map(l => { 
            const isOOS = l.vesselStatus === 'Out of Service (Unseaworthy)'; 
            const isPartsPending = l.vesselStatus && l.vesselStatus.includes('Parts Pending'); 
            const isWIPStatus = l.vesselStatus === 'Work in Progress (WIP)'; 

            let cardClass = ''; 
            let badgeClass = 'badge-success'; 
            if (isOOS) { cardClass = 'unseaworthy'; badgeClass = 'badge-danger'; } 
            else if (isPartsPending) { cardClass = 'parts-pending'; badgeClass = 'badge-warning'; } 
            else if (isWIPStatus) { cardClass = 'wip-status'; badgeClass = 'badge-info'; } 

            let partsTableHtml = ''; 
            let totalPartsCost = 0; 
            if (l.parts && l.parts.length > 0) { 
                const rows = l.parts.map(p => { 
                    let costVal = parseFloat(p.cost) || 0; 
                    totalPartsCost += costVal; 
                    return `<tr><td>${p.name}</td><td>${p.partNo || 'N/A'}</td><td>${p.qty || '1'}</td><td>${isNaN(p.cost) ? p.cost : '$' + Number(p.cost).toFixed(2)}</td></tr>`; 
                }).join(''); 
                partsTableHtml = ` 
                    <div style="margin-top: 8px;"> 
                        <span style="font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; font-weight: 600;">Parts Installed / Needed:</span> 
                        <table class="parts-list-table"> 
                            <thead><tr><th>Part Name</th><th>P/N / SKU</th><th>Qty</th><th>Unit Cost</th></tr></thead> 
                            <tbody>${rows}</tbody> 
                        </table> 
                    </div> 
                `; 
            } 

            let mediaHtml = ''; 
            if (l.mediaList && Array.isArray(l.mediaList) && l.mediaList.length > 0) { 
                const mediaItems = l.mediaList.map(m => { 
                    if (m.type && m.type.startsWith('video')) { 
                        return `<video controls src="${m.base64}"></video>`; 
                    } else { 
                        return `<img src="${m.base64}" alt="Attachment">`; 
                    } 
                }).join(''); 
                mediaHtml = `<div class="log-media" style="display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px;">${mediaItems}</div>`; 
            } else if (l.mediaBase64) { 
                if (l.mediaType && l.mediaType.startsWith('video')) { 
                    mediaHtml = `<div class="log-media"><video controls src="${l.mediaBase64}"></video></div>`; 
                } else { 
                    mediaHtml = `<div class="log-media"><img src="${l.mediaBase64}" alt="Attachment"></div>`; 
                } 
            } 

            let recurringInfo = ''; 
            if (l.hasNextService) { 
                recurringInfo = `<div class="log-detail-item"><span>Next Service Due</span><strong>${l.nextServiceDate || 'N/A'} (${l.nextServiceHours || 'N/A'})</strong></div>`; 
            } 

            return ` 
                <div class="log-card ${cardClass}"> 
                    <div class="log-header"> 
                        <div> 
                            <div class="log-title">⚓ ${l.vesselName} — ${l.equipment}</div> 
                            <div class="log-date">Logged on ${l.logDate} by ${l.techName} ${l.engineHours ? '| ' + l.engineHours : ''}</div> 
                        </div> 
                        <span class="badge ${badgeClass}">${l.vesselStatus}</span> 
                    </div> 
                    <div class="log-details"> 
                        <div class="log-detail-item"><span>Category</span><strong>${l.category}</strong></div> 
                        <div class="log-detail-item"><span>Status / Sign-off</span><strong>${l.signoff ? '✅ Approved for Service' : '❌ Restricted / OOS'}</strong></div> 
                        <div class="log-detail-item"><span>Labor & Parts Cost</span><strong>$${(Number(l.laborHours || 0) * 50 + totalPartsCost).toFixed(2)}</strong></div> 
                        ${recurringInfo} 
                    </div> 
                    ${l.defect ? `<div style="font-size: 0.9rem;"><span><strong>Defect:</strong> ${l.defect}</span></div>` : ''} 
                    <div style="font-size: 0.9rem;"><span><strong>Work Done:</strong> ${l.workDone}</span></div> 
                    ${partsTableHtml} 
                    ${mediaHtml} 
                    <div class="log-actions"> 
                        ${l.hasNextService ? `<button class="btn-complete-recurring" onclick="completeRecurringTask('${l.id}')">✔️ Complete & Re-Log</button>` : ''} 
                        <button class="btn-edit" onclick="editLog('${l.id}')">✏️ Edit</button> 
                        <button class="btn-delete" onclick="deleteLog('${l.id}')">🗑️ Delete</button> 
                    </div> 
                </div> 
            `; 
        }).join(''); 
    } 

    updateKPIs(); 
} 

function calculateLogTotalCost(l) { 
    let partsCost = 0; 
    if (l.parts && Array.isArray(l.parts)) { 
        l.parts.forEach(p => { 
            let c = parseFloat(p.cost); 
            if (!isNaN(c)) partsCost += c; 
        }); 
    } 
    let laborCost = (parseFloat(l.laborHours) || 0) * 50; 
    return partsCost + laborCost; 
} 

function updateKPIs() { 
    const totalLogs = logs.length; 
    const oosVessels = logs.filter(l => l.vesselStatus === 'Out of Service (Unseaworthy)').length; 
    const partsPending = logs.filter(l => l.vesselStatus && l.vesselStatus.includes('Parts Pending')).length; 

    let totalSpend = 0; 
    logs.forEach(l => { 
        totalSpend += calculateLogTotalCost(l); 
    }); 

    document.getElementById('kpi-total-logs').innerText = totalLogs; 
    document.getElementById('kpi-oos-vessels').innerText = oosVessels; 
    document.getElementById('kpi-parts-pending').innerText = partsPending; 
    document.getElementById('kpi-total-spend').innerText = '$' + totalSpend.toFixed(2); 

    updateChart(); 
}

} 

function exportJSON() { 
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(logs, null, 2)); 
    const dlAnchorElem = document.createElement('a'); 
    dlAnchorElem.setAttribute("href", dataStr); 
    dlAnchorElem.setAttribute("download", `vessel_maintenance_logs_${new Date().toISOString().split('T')[0]}.json`); 
    dlAnchorElem.click(); 
} 

function importJSON(event) { 
    const file = event.target.files[0]; 
    if (!file) return; 
    const reader = new FileReader(); 
    reader.onload = function(e) { 
        try { 
            const imported = JSON.parse(e.target.result); 
            if (Array.isArray(imported)) { 
                let updates = {}; 
                imported.forEach(item => { 
                    if (item.id) { 
                        updates[item.id] = item; 
                    } 
                }); 
                dbRef.set(updates).then(() => { 
                    alert("Data imported successfully!"); 
                }); 
            } else { 
                alert("Invalid JSON format. Expected an array of logs."); 
            } 
        } catch (err) { 
            alert("Error parsing JSON file: " + err.message); 
        } 
    }; 
    reader.readAsText(file); 
} 
</script>
