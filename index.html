<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vessel Maintenance & Technical Logbook</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dark: {
                            900: '#0f172a',
                            800: '#1e293b',
                            700: '#334155',
                            600: '#475569'
                        }
                    }
                }
            }
        }
    </script>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <!-- SheetJS for Excel export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #0b1120;
            color: #f8fafc;
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col font-sans antialiased">

    <!-- Top Navigation Header -->
    <header class="bg-dark-800 border-b border-dark-700 sticky top-0 z-40 shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-cyan-600 p-2 rounded-lg text-white">
                    <i class="fa-solid fa-anchor text-xl"></i>
                </div>
                <h1 class="text-xl font-bold tracking-tight text-white">Vessel Maintenance Logbook</h1>
            </div>
            <div class="flex items-center space-x-3">
                <span id="sync-status" class="inline-flex items-center px-3 py-1 rounded-full text-xs font-medium bg-amber-500/10 text-amber-400 border border-amber-500/20">
                    <span class="w-2 h-2 mr-1.5 rounded-full bg-amber-400 animate-pulse"></span> Connecting...
                </span>
                <button onclick="exportToExcel()" class="inline-flex items-center px-3 py-1.5 border border-dark-600 rounded-md text-xs font-medium text-slate-200 bg-dark-700 hover:bg-dark-600 transition">
                    <i class="fa-solid fa-file-excel mr-1.5 text-emerald-400"></i> Export Data
                </button>
                <label class="inline-flex items-center px-3 py-1.5 border border-dark-600 rounded-md text-xs font-medium text-slate-200 bg-dark-700 hover:bg-dark-600 transition cursor-pointer">
                    <i class="fa-solid fa-file-import mr-1.5 text-cyan-400"></i> Import Data
                    <input type="file" id="import-file-input" accept=".json,.xlsx" class="hidden" onchange="importData(event)">
                </label>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-8">

        <!-- New Log Entry Form Section -->
        <section class="bg-dark-800 rounded-xl border border-dark-700 shadow-xl p-6">
            <div class="flex items-center justify-between mb-6 pb-4 border-b border-dark-700">
                <h2 class="text-lg font-semibold text-white flex items-center">
                    <i class="fa-solid fa-pen-to-square text-cyan-400 mr-2"></i> New Log Entry
                </h2>
                <button type="button" onclick="resetForm()" class="text-xs text-slate-400 hover:text-white transition">
                    <i class="fa-solid fa-rotate-right mr-1"></i> Clear Form
                </button>
            </div>

            <form id="log-form" onsubmit="handleFormSubmit(event)" class="space-y-6">
                <!-- Grid Row 1 -->
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Vessel Name</label>
                        <input type="text" id="vessel-name" required class="w-full bg-dark-900 border border-dark-700 rounded-lg px-3.5 py-2 text-sm text-white focus:outline-none focus:border-cyan-500 transition">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Equipment / Component</label>
                        <input type="text" id="equipment-name" required class="w-full bg-dark-900 border border-dark-700 rounded-lg px-3.5 py-2 text-sm text-white focus:outline-none focus:border-cyan-500 transition">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Marine System / Category</label>
                        <select id="marine-category" class="w-full bg-dark-900 border border-dark-700 rounded-lg px-3.5 py-2 text-sm text-white focus:outline-none focus:border-cyan-500 transition">
                            <option value="Propulsion / Main Engines">Propulsion / Main Engines</option>
                            <option value="Generators & Electrical">Generators & Electrical</option>
                            <option value="Hull & Deck">Hull & Deck</option>
                            <option value="Navigation & Electronics">Navigation & Electronics</option>
                            <option value="Plumbing & Bilge">Plumbing & Bilge</option>
                            <option value="Safety & Fire">Safety & Fire</option>
                            <option value="HVAC">HVAC</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Log Date</label>
                        <input type="date" id="log-date" required class="w-full bg-dark-900 border border-dark-700 rounded-lg px-3.5 py-2 text-sm text-white focus:outline-none focus:border-cyan-500 transition">
                    </div>
                </div>

                <!-- Grid Row 2 -->
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Vessel Operational Status</label>
                        <select id="operational-status" class="w-full bg-dark-900 border border-dark-700 rounded-lg px-3.5 py-2 text-sm text-white focus:outline-none focus:border-cyan-500 transition">
                            <option value="Operational (Ready for Sea)">Operational (Ready for Sea)</option>
                            <option value="Under Maintenance / Restricted">Under Maintenance / Restricted</option>
                            <option value="Out of Service / AOG">Out of Service / AOG</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Technician Name</label>
                        <input type="text" id="technician-name" class="w-full bg-dark-900 border border-dark-700 rounded-lg px-3.5 py-2 text-sm text-white focus:outline-none focus:border-cyan-500 transition">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Engine / Generator Hours</label>
                        <input type="text" id="engine-hours" class="w-full bg-dark-900 border border-dark-700 rounded-lg px-3.5 py-2 text-sm text-white focus:outline-none focus:border-cyan-500 transition">
                    </div>
                    <div class="flex items-center pt-6">
                        <label class="relative flex items-center cursor-pointer">
                            <input type="checkbox" id="approved-service" class="sr-only peer">
                            <div class="w-5 h-5 bg-dark-900 border border-dark-700 rounded peer peer-checked:bg-cyan-600 peer-checked:border-cyan-600 flex items-center justify-center text-white transition">
                                <i class="fa-solid fa-check text-xs opacity-0 peer-checked:opacity-100"></i>
                            </div>
                            <span class="ml-3 text-sm font-medium text-slate-200">Approved for Service / Sea</span>
                        </label>
                    </div>
                </div>

                <!-- Textareas -->
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Defect / Issue Observed</label>
                        <textarea id="defect-observed" rows="3" class="w-full bg-dark-900 border border-dark-700 rounded-lg px-3.5 py-2 text-sm text-white focus:outline-none focus:border-cyan-500 transition"></textarea>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Work Accomplished / Maintenance Action Taken</label>
                        <textarea id="work-accomplished" rows="3" class="w-full bg-dark-900 border border-dark-700 rounded-lg px-3.5 py-2 text-sm text-white focus:outline-none focus:border-cyan-500 transition"></textarea>
                    </div>
                </div>

                <!-- Parts Installed Table -->
                <div class="space-y-3">
                    <div class="flex items-center justify-between">
                        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider">Parts Installed / Needed (Optional)</label>
                        <button type="button" onclick="addPartRow()" class="text-xs text-cyan-400 hover:text-cyan-300 font-medium transition">
                            <i class="fa-solid fa-plus mr-1"></i> Add Part / Item
                        </button>
                    </div>
                    <div class="border border-dark-700 rounded-lg overflow-hidden bg-dark-900">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-dark-800 border-b border-dark-700 text-slate-400 text-xs uppercase tracking-wider">
                                    <th class="py-2.5 px-4 font-semibold">Part Name / Desc</th>
                                    <th class="py-2.5 px-4 font-semibold w-40">P/N or SKU</th>
                                    <th class="py-2.5 px-4 font-semibold w-28">Qty / Unit</th>
                                    <th class="py-2.5 px-4 font-semibold w-32">Unit Cost ($)</th>
                                    <th class="py-2.5 px-3 font-semibold w-12 text-center"><span class="sr-only">Actions</span></th>
                                </tr>
                            </thead>
                            <tbody id="parts-table-body" class="divide-y divide-dark-700 text-sm">
                                <!-- Dynamic part rows inserted here -->
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Extra Details Grid -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 pt-2">
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Labor Hours</label>
                        <input type="number" step="0.25" id="labor-hours" class="w-full bg-dark-900 border border-dark-700 rounded-lg px-3.5 py-2 text-sm text-white focus:outline-none focus:border-cyan-500 transition">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Attach Photos or Videos</label>
                        <input type="file" id="media-files" multiple accept="image/*,video/*" class="w-full text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-dark-700 file:text-slate-200 hover:file:bg-dark-600 cursor-pointer transition">
                    </div>
                </div>

                <!-- Recurring Maintenance Toggle -->
                <div class="p-4 bg-dark-900 border border-dark-700 rounded-lg space-y-4">
                    <label class="relative flex items-center cursor-pointer">
                        <input type="checkbox" id="recurring-toggle" onchange="toggleRecurringOptions()" class="sr-only peer">
                        <div class="w-5 h-5 bg-dark-800 border border-dark-700 rounded peer peer-checked:bg-cyan-600 peer-checked:border-cyan-600 flex items-center justify-center text-white transition">
                            <i class="fa-solid fa-check text-xs opacity-0 peer-checked:opacity-100"></i>
                        </div>
                        <span class="ml-3 text-sm font-medium text-white">Schedule Recurring Maintenance / Next Service Task</span>
                    </label>

                    <div id="recurring-options" class="hidden grid grid-cols-1 sm:grid-cols-3 gap-4 pt-2 border-t border-dark-700">
                        <div>
                            <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Task Title</label>
                            <input type="text" id="rec-title" class="w-full bg-dark-800 border border-dark-700 rounded-lg px-3.5 py-2 text-sm text-white focus:outline-none focus:border-cyan-500 transition">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Due Date</label>
                            <input type="date" id="rec-duedate" class="w-full bg-dark-800 border border-dark-700 rounded-lg px-3.5 py-2 text-sm text-white focus:outline-none focus:border-cyan-500 transition">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Due Engine Hours</label>
                            <input type="text" id="rec-duehours" class="w-full bg-dark-800 border border-dark-700 rounded-lg px-3.5 py-2 text-sm text-white focus:outline-none focus:border-cyan-500 transition">
                        </div>
                    </div>
                </div>

                <!-- Submit Button -->
                <div>
                    <button type="submit" class="w-full bg-cyan-500 hover:bg-cyan-400 text-dark-900 font-bold py-3 px-4 rounded-lg shadow-lg transition">
                        SAVE LOG ENTRY
                    </button>
                </div>
            </form>
        </section>

        <!-- Filter & Search Toolbar -->
        <section class="bg-dark-800 rounded-xl border border-dark-700 p-4 shadow-md space-y-4">
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4">
                <div>
                    <select id="filter-vessel" onchange="filterLogs()" class="w-full bg-dark-900 border border-dark-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-cyan-500 transition">
                        <option value="">All Vessels</option>
                    </select>
                </div>
                <div>
                    <select id="filter-category" onchange="filterLogs()" class="w-full bg-dark-900 border border-dark-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-cyan-500 transition">
                        <option value="">All Categories</option>
                    </select>
                </div>
                <div>
                    <select id="filter-status" onchange="filterLogs()" class="w-full bg-dark-900 border border-dark-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-cyan-500 transition">
                        <option value="">All Work Statuses</option>
                    </select>
                </div>
                <div>
                    <select id="filter-task" onchange="filterLogs()" class="w-full bg-dark-900 border border-dark-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-cyan-500 transition">
                        <option value="">All Maintenance Tasks</option>
                    </select>
                </div>
                <div>
                    <select id="sort-order" onchange="filterLogs()" class="w-full bg-dark-900 border border-dark-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-cyan-500 transition">
                        <option value="newest">Sort: Newest First</option>
                        <option value="oldest">Sort: Oldest First</option>
                    </select>
                </div>
            </div>
            <div>
                <input type="text" id="search-query" oninput="filterLogs()" class="w-full bg-dark-900 border border-dark-700 rounded-lg px-3.5 py-2 text-sm text-white focus:outline-none focus:border-cyan-500 transition">
            </div>
        </section>

        <!-- Log Entries List Section -->
        <section id="logs-container" class="space-y-6">
            <div class="bg-dark-800 rounded-xl border border-dark-700 p-8 text-center text-slate-400">
                No maintenance log entries found matching current filters.
            </div>
        </section>

    </main>

    <!-- Application Script Logic -->
    <script>
        // Firebase configuration and initialization placeholder
        const firebaseConfig = {
            databaseURL: "https://fleet-maint-log-default-rtdb.firebaseio.com/"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let logsData = {};

        document.addEventListener('DOMContentLoaded', () => {
            // Set today's date as default
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('log-date').value = today;

            // Load initial logs
            const logsRef = db.ref('logs');
            logsRef.on('value', (snapshot) => {
                logsData = snapshot.val() || {};
                updateSyncStatus(true);
                updateFiltersDropdowns();
                renderLogs();
            }, (error) => {
                console.error(error);
                updateSyncStatus(false);
            });
        });

        function updateSyncStatus(isSynced) {
            const statusEl = document.getElementById('sync-status');
            if (isSynced) {
                statusEl.className = 'inline-flex items-center px-3 py-1 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20';
                statusEl.innerHTML = '<span class="w-2 h-2 mr-1.5 rounded-full bg-emerald-400"></span> Enabled';
            } else {
                statusEl.className = 'inline-flex items-center px-3 py-1 rounded-full text-xs font-medium bg-rose-500/10 text-rose-400 border border-rose-500/20';
                statusEl.innerHTML = '<span class="w-2 h-2 mr-1.5 rounded-full bg-rose-400"></span> Disconnected';
            }
        }

        function addPartRow() {
            const tbody = document.getElementById('parts-table-body');
            const tr = document.createElement('tr');
            tr.className = 'border-b border-dark-700/50 hover:bg-dark-800/50 transition';
            tr.innerHTML = `
                <td class="py-2 px-4"><input type="text" class="part-name w-full bg-dark-800 border border-dark-700 rounded px-2.5 py-1 text-sm text-white focus:outline-none focus:border-cyan-500"></td>
                <td class="py-2 px-4"><input type="text" class="part-pn w-full bg-dark-800 border border-dark-700 rounded px-2.5 py-1 text-sm text-white focus:outline-none focus:border-cyan-500"></td>
                <td class="py-2 px-4"><input type="text" class="part-qty w-full bg-dark-800 border border-dark-700 rounded px-2.5 py-1 text-sm text-white focus:outline-none focus:border-cyan-500"></td>
                <td class="py-2 px-4"><input type="number" step="0.01" class="part-cost w-full bg-dark-800 border border-dark-700 rounded px-2.5 py-1 text-sm text-white focus:outline-none focus:border-cyan-500"></td>
                <td class="py-2 px-3 text-center"><button type="button" onclick="this.closest('tr').remove()" class="text-rose-400 hover:text-rose-300 transition"><i class="fa-solid fa-trash-can text-xs"></i></button></td>
            `;
            tbody.appendChild(tr);
        }

        function toggleRecurringOptions() {
            const container = document.getElementById('recurring-options');
            const toggle = document.getElementById('recurring-toggle');
            if (toggle.checked) {
                container.classList.remove('hidden');
            } else {
                container.classList.add('hidden');
            }
        }

        function resetForm() {
            document.getElementById('log-form').reset();
            document.getElementById('parts-table-body').innerHTML = '';
            document.getElementById('recurring-options').classList.add('hidden');
            document.getElementById('log-date').value = new Date().toISOString().split('T')[0];
        }

        function handleFormSubmit(e) {
            e.preventDefault();
            // Data collection logic goes here
        }

        function updateFiltersDropdowns() {
            // Populate filter options dynamically from existing data
        }

        function filterLogs() {
            renderLogs();
        }

        function renderLogs() {
            // Render logs table/cards list
        }

        function exportToExcel() {
            // Export handling
        }

        function importData(e) {
            // Import handling
        }
    </script>
</body>
</html>
